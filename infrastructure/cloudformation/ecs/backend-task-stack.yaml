AWSTemplateFormatVersion: "2010-09-09"
Description: Backend Task Definition for Flask app running on port 9000

Parameters:
  ImageUri:
    Type: String
    Description: ECR Image URI for Flask Backend (flask-backend)

  DBUser:
    Type: String
    Description: MongoDB username
    NoEcho: true

  DBPassword:
    Type: String
    Description: MongoDB password
    NoEcho: true

  DBCluster:
    Type: String
    Description: MongoDB cluster URL (e.g. cluster0.xxxx.mongodb.net)

  DBName:
    Type: String
    Description: MongoDB database name
    Default: user_db

  ExecutionRoleArn:
    Type: String
    Description: Existing ECS task execution role ARN

Resources:
  BackendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: flask-backend-task
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn: !Ref ExecutionRoleArn
      ContainerDefinitions:
        - Name: flask-backend
          Image: !Ref ImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 9000
              Protocol: tcp
          Environment:
            - Name: PORT
              Value: "9000"
            - Name: DB_USER
              Value: !Ref DBUser
            - Name: DB_PASSWORD
              Value: !Ref DBPassword
            - Name: DB_CLUSTER
              Value: !Ref DBCluster
            - Name: DB_NAME
              Value: !Ref DBName
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /ecs/flask-backend-task
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: backend
          HealthCheck:
            Command:
              - CMD-SHELL
              - curl -f http://localhost:9000/health || exit 1
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60

Outputs:
  BackendTaskDefinitionArn:
    Description: Backend Task Definition ARN
    Value: !Ref BackendTaskDefinition
    Export:
      Name: backend-task-definition-arn
