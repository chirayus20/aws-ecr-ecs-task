AWSTemplateFormatVersion: "2010-09-09"
Description: Backend Task Definition for Flask app running on port 9000

Parameters:
  ImageUri:
    Type: String
    Description: ECR Image URI for Flask Backend (express-backend)

  DBUser:
    Type: String
    Description: MongoDB username
    NoEcho: true

  DBPassword:
    Type: String
    Description: MongoDB password
    NoEcho: true

  DBCluster:
    Type: String
    Description: MongoDB cluster URL (e.g. cluster0.xxxx.mongodb.net)

  DBName:
    Type: String
    Description: MongoDB database name
    Default: user_db

Resources:
  BackendTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  BackendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: express-backend-task
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn: !GetAtt BackendTaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: express-backend
          Image: !Ref ImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 9000
              Protocol: tcp
          Environment:
            - Name: PORT
              Value: "9000"
            - Name: DB_USER
              Value: !Ref DBUser
            - Name: DB_PASSWORD
              Value: !Ref DBPassword
            - Name: DB_CLUSTER
              Value: !Ref DBCluster
            - Name: DB_NAME
              Value: !Ref DBName
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /ecs/express-backend
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: backend
          HealthCheck:
            Command:
              - CMD-SHELL
              - curl -f http://localhost:9000/health || exit 1
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60

Outputs:
  BackendTaskDefinitionArn:
    Description: Backend Task Definition ARN
    Value: !Ref BackendTaskDefinition
    Export:
      Name: backend-task-definition-arn
