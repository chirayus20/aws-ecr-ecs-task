AWSTemplateFormatVersion: "2010-09-09"
Description: Frontend Task Definition for Express app running on port 8000

Parameters:
  ImageUri:
    Type: String
    Description: ECR Image URI for Express Frontend (express-frontend)

  BackendUrl:
    Type: String
    Description: Backend service URL (e.g. http://BACKEND-PUBLIC-IP:9000)

Resources:
  FrontendTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  FrontendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: express-frontend-task
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn: !GetAtt FrontendTaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: express-frontend
          Image: !Ref ImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 8000
              Protocol: tcp
          Environment:
            - Name: PORT
              Value: "8000"
            - Name: BACKEND_URL
              Value: !Ref BackendUrl
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /ecs/express-frontend
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: frontend
          HealthCheck:
            Command:
              - CMD-SHELL
              - curl -f http://localhost:8000/health || exit 1
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60

Outputs:
  FrontendTaskDefinitionArn:
    Description: Frontend Task Definition ARN
    Value: !Ref FrontendTaskDefinition
    Export:
      Name: frontend-task-definition-arn
